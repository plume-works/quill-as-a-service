# The reviewer entrypoint's tests; reviewer/review.py itself is a PEP 723 script.
[project]
name = "quill-as-a-service"
version = "0"
requires-python = ">=3.14"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
